<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>תקציב שנתי — בדיקת API</title>
<style>
  :root {
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* blue: primary hero figures */
    --status-good:    #0ca30c;
    --status-critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --status-good:    #0ca30c;
      --status-critical:#e66767;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
    padding: 24px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); margin: 0 0 20px; font-size: 0.9rem; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 0.78rem; color: var(--text-secondary); }
  .field input {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--baseline);
    border-radius: 6px;
    background: var(--surface-1);
    color: var(--text-primary);
    width: 120px;
  }
  button {
    font: inherit;
    padding: 7px 16px;
    border: none;
    border-radius: 8px;
    background: var(--series-1);
    color: white;
    cursor: pointer;
  }
  button:hover { filter: brightness(0.92); }
  button.secondary {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--baseline);
  }
  button.icon {
    padding: 2px 10px;
    font-size: 1rem;
    line-height: 1.4;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .card h2 { font-size: 1rem; margin: 0 0 16px; }

  .stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat-tile {
    flex: 1 1 220px;
    min-width: 220px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .stat-tile .label { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 4px; }
  .stat-tile .value { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .stat-tile .value.accent { color: var(--series-1); }
  .stat-tile .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
  .stat-tile .edit-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .stat-tile .edit-row input {
    font: inherit;
    font-variant-numeric: tabular-nums;
    padding: 5px 8px;
    border: 1px solid var(--baseline);
    border-radius: 6px;
    background: var(--page-plane);
    color: var(--text-primary);
    width: 110px;
  }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--gridline); font-size: 0.88rem; }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; }
  td.num { text-align: left; }

  tr.month-header td {
    background: color-mix(in srgb, var(--series-1) 6%, transparent);
    font-weight: 600;
    border-bottom: 1px solid var(--gridline);
  }
  tr.month-header .month-name { display: flex; align-items: center; gap: 10px; }

  tr.empty-hint td { color: var(--text-muted); font-size: 0.82rem; font-style: italic; }

  tr.add-form td { background: color-mix(in srgb, var(--series-1) 4%, transparent); }
  .add-form-fields { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .add-form-fields input {
    font: inherit;
    padding: 5px 8px;
    border: 1px solid var(--baseline);
    border-radius: 6px;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .add-form-fields input[name="name"] { width: 200px; }
  .add-form-fields input[name="amount"] { width: 120px; font-variant-numeric: tabular-nums; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78rem;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .badge.good { color: var(--status-good); background: color-mix(in srgb, var(--status-good) 12%, transparent); }
  .badge.pending { color: var(--text-secondary); background: color-mix(in srgb, var(--text-secondary) 12%, transparent); }

  .error { color: var(--status-critical); font-size: 0.88rem; margin: 8px 0; }
</style>
</head>
<body>
  <h1>תקציב שנתי</h1>
  <p class="subtitle">קליינט בדיקה ידני מול FamilyBudget.Api — Feature 1: מנוע תקציב שנתי והחלקה</p>

  <div class="controls">
    <div class="field">
      <label for="year">שנה</label>
      <input id="year" type="number" value="2026" />
    </div>
    <button id="refresh">רענן</button>
  </div>

  <div id="error" class="error" hidden></div>

  <div class="stat-row" style="margin-bottom: 20px;">
    <div class="stat-tile">
      <div class="label">כמה יש לנו בקופה</div>
      <div class="value" id="stat-reserve">—</div>
      <div class="edit-row">
        <input id="reserve-input" type="number" min="0" step="1" />
        <button id="save-reserve" class="secondary">שמור</button>
      </div>
    </div>
    <div class="stat-tile">
      <div class="label">כמה עוד לא נוצל לשנה זו</div>
      <div class="value" id="stat-not-covered">—</div>
      <div class="hint" id="stat-total-hint"></div>
    </div>
    <div class="stat-tile">
      <div class="label">הפרשה נדרשת לכל חודש</div>
      <div class="value accent" id="stat-monthly">—</div>
    </div>
  </div>

  <div class="card">
    <h2>הוצאות לפי חודש</h2>
    <table>
      <thead>
        <tr>
          <th>שם</th>
          <th class="num">סכום שנתי</th>
          <th class="num">כבר הופרש</th>
          <th>סטטוס</th>
        </tr>
      </thead>
      <tbody id="monthly-rows"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>הוצאות כלליות (לא תלויות חודש)</h2>
    <table>
      <thead>
        <tr>
          <th>שם</th>
          <th class="num">סכום שנתי</th>
          <th class="num">כבר הופרש</th>
          <th>סטטוס</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="general-rows"></tbody>
      <tfoot>
        <tr>
          <td colspan="5">
            <button id="general-add-toggle" class="icon">+ הוסף הוצאה כללית</button>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script>
    const monthNames = ["", "תשרי", "חשוון", "כסלו", "טבת", "שבט", "אדר", "ניסן", "אייר", "סיוון", "תמוז", "אב", "אלול"];

    function fmtMoney(n) {
      return new Intl.NumberFormat("he-IL", { maximumFractionDigits: 0 }).format(n) + " ₪";
    }

    function fmtNum(n) {
      return new Intl.NumberFormat("he-IL", { maximumFractionDigits: 0 }).format(n);
    }

    function showError(message) {
      const errorEl = document.getElementById("error");
      errorEl.textContent = "שגיאה: " + message;
      errorEl.hidden = false;
    }

    function clearError() {
      document.getElementById("error").hidden = true;
    }

    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`${res.status}: ${text || res.statusText}`);
      }
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    function currentYear() {
      return document.getElementById("year").value;
    }

    async function refresh() {
      clearError();
      try {
        const data = await fetchJson(`/api/annual-budget?year=${currentYear()}`);
        renderSummary(data);
        renderMonthlyTable(data.items);
        renderGeneralTable(data.items);
      } catch (err) {
        showError(err.message);
      }
    }

    function renderSummary(data) {
      document.getElementById("stat-reserve").textContent = fmtMoney(data.reserveOnHand);
      document.getElementById("reserve-input").value = data.reserveOnHand;
      document.getElementById("stat-not-covered").textContent = fmtMoney(data.notYetCovered);
      document.getElementById("stat-total-hint").textContent =
        `מתוך סך תקציב שנתי של ${fmtMoney(data.totalAnnualBudget)}`;
      document.getElementById("stat-monthly").textContent = fmtMoney(data.monthlyAllocation);
    }

    function statusBadge(item) {
      return item.isFullyFunded
        ? '<span class="badge good">✓ מומן במלואו</span>'
        : '<span class="badge pending">בתהליך</span>';
    }

    function renderMonthlyTable(items) {
      const tbody = document.getElementById("monthly-rows");
      tbody.innerHTML = "";

      for (let month = 1; month <= 12; month++) {
        const monthItems = items.filter(i => i.targetMonth === month);

        const headerRow = document.createElement("tr");
        headerRow.className = "month-header";
        headerRow.innerHTML = `
          <td colspan="3"><div class="month-name">${monthNames[month]}</div></td>
          <td><button class="icon add-toggle" data-month="${month}">+</button></td>
        `;
        tbody.appendChild(headerRow);

        if (monthItems.length === 0) {
          const hintRow = document.createElement("tr");
          hintRow.className = "empty-hint";
          hintRow.innerHTML = `<td colspan="4">אין הוצאות מוגדרות לחודש זה עדיין.</td>`;
          tbody.appendChild(hintRow);
        } else {
          for (const item of monthItems) {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${item.name}</td>
              <td class="num">${fmtMoney(item.totalAmount)}</td>
              <td class="num">${fmtMoney(item.amountAlreadySetAside)}</td>
              <td>${statusBadge(item)}</td>
            `;
            tbody.appendChild(row);
          }
        }
      }

      tbody.querySelectorAll(".add-toggle").forEach(btn => {
        btn.addEventListener("click", () => toggleAddForm(tbody, Number(btn.dataset.month), btn));
      });
    }

    function toggleAddForm(tbody, month, anchorBtn) {
      const existing = tbody.querySelector(`tr.add-form[data-month="${month}"]`);
      if (existing) {
        existing.remove();
        return;
      }

      const formRow = document.createElement("tr");
      formRow.className = "add-form";
      formRow.dataset.month = month;
      formRow.innerHTML = `
        <td colspan="4">
          <div class="add-form-fields">
            <input name="name" type="text" placeholder="שם ההוצאה" />
            <input name="amount" type="number" min="0.01" step="0.01" placeholder="סכום שנתי" />
            <button class="save-btn">שמור</button>
            <button class="secondary cancel-btn">ביטול</button>
          </div>
        </td>
      `;

      const headerRow = anchorBtn.closest("tr");
      headerRow.after(formRow);

      formRow.querySelector(".cancel-btn").addEventListener("click", () => formRow.remove());
      formRow.querySelector(".save-btn").addEventListener("click", () =>
        submitNewItem(formRow, month));
    }

    async function submitNewItem(formRow, targetMonth) {
      const name = formRow.querySelector('input[name="name"]').value.trim();
      const amount = parseFloat(formRow.querySelector('input[name="amount"]').value);

      if (!name || !(amount > 0)) {
        showError("יש להזין שם וסכום חיובי.");
        return;
      }

      try {
        await fetchJson("/api/annual-budget-items", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            year: Number(currentYear()),
            name,
            totalAmount: amount,
            targetMonth: targetMonth,
          }),
        });
        clearError();
        await refresh();
      } catch (err) {
        showError(err.message);
      }
    }

    function renderGeneralTable(items) {
      const tbody = document.getElementById("general-rows");
      tbody.innerHTML = "";

      const generalItems = items.filter(i => i.targetMonth == null);
      if (generalItems.length === 0) {
        const hintRow = document.createElement("tr");
        hintRow.innerHTML = `<td colspan="4" style="color: var(--text-muted); font-style: italic;">אין הוצאות כלליות עדיין.</td>`;
        tbody.appendChild(hintRow);
      } else {
        for (const item of generalItems) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${item.name}</td>
            <td class="num">${fmtMoney(item.totalAmount)}</td>
            <td class="num">${fmtMoney(item.amountAlreadySetAside)}</td>
            <td>${statusBadge(item)}</td>
          `;
          tbody.appendChild(row);
        }
      }
    }

    document.getElementById("refresh").addEventListener("click", refresh);

    document.getElementById("save-reserve").addEventListener("click", async () => {
      const amount = parseFloat(document.getElementById("reserve-input").value);
      if (!(amount >= 0)) {
        showError("סכום הקופה חייב להיות מספר אי-שלילי.");
        return;
      }
      try {
        await fetchJson(`/api/reserve?year=${currentYear()}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount }),
        });
        clearError();
        await refresh();
      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById("general-add-toggle").addEventListener("click", () => {
      const tbody = document.getElementById("general-rows");
      const existing = tbody.querySelector("tr.add-form");
      if (existing) {
        existing.remove();
        return;
      }

      const formRow = document.createElement("tr");
      formRow.className = "add-form";
      formRow.innerHTML = `
        <td colspan="4">
          <div class="add-form-fields">
            <input name="name" type="text" placeholder="שם ההוצאה" />
            <input name="amount" type="number" min="0.01" step="0.01" placeholder="סכום שנתי" />
            <button class="save-btn">שמור</button>
            <button class="secondary cancel-btn">ביטול</button>
          </div>
        </td>
      `;
      tbody.prepend(formRow);

      formRow.querySelector(".cancel-btn").addEventListener("click", () => formRow.remove());
      formRow.querySelector(".save-btn").addEventListener("click", () =>
        submitNewItem(formRow, null));
    });

    refresh();
  </script>
</body>
</html>
